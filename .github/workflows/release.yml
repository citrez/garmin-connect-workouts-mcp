name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish npm (requires configured npm trusted publisher or NPM_TOKEN)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG!=="v"+p.version) throw new Error("Tag and package version differ")'
      - run: npm test
      - run: npm run test:package -- --browser-smoke
      - run: npm run release:artifacts
      - run: node scripts/plugin-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: garmin-release
          path: release/*
          if-no-files-found: error
      - name: Publish GitHub archives
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "Garmin Workouts $RELEASE_TAG" --notes-file docs/release-notes.md

  npm:
    if: inputs.publish_npm || vars.NPM_TRUSTED_PUBLISHING == 'true'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: garmin-release
          path: release
      - name: Publish the tested package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish release/*.tgz --access public --provenance --ignore-scripts
