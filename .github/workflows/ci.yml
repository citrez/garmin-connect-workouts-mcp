name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.12.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm test
      - name: Test a clean packaged install and real Chrome
        run: npm run test:package -- --browser-smoke
      - name: Build distributable archives
        run: npm run release:artifacts
      - name: Verify the standalone plugin archive
        run: node scripts/plugin-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        with:
          name: garmin-release-candidate
          path: release/*
          if-no-files-found: error
